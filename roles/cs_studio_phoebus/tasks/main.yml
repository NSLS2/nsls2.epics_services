---
- name: Load shared collection defaults
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../../vars/shared.yml"

# The port is <prefix> followed by four digits, so only 1-5 keep it below 65536.
- name: Check the launcher's single-instance port prefix
  ansible.builtin.assert:
    that: cs_studio_phoebus_server_port_prefix | string is match('^[1-5]?$')
    fail_msg: "cs_studio_phoebus_server_port_prefix must be empty or one digit from 1 to 5."
    quiet: true

# === Runtime dependencies (shared by both install methods) ===
- name: Install JDK dependency
  ansible.builtin.include_role:
    name: nsls2.epics_services.jdk_dep
  when: cs_studio_phoebus_install_deps | bool

# === RPM install path ===
- name: Install Phoebus product from RPM
  when: epics_services_use_rpms | bool
  block:
    - name: Install nsls2-phoebus product RPM
      become: true
      ansible.builtin.package:
        name: "{{ cs_studio_phoebus_rpm_name | default('nsls2-phoebus-beamlines') }}-{{ cs_studio_phoebus_version | regex_replace('^v', '') }}"
        state: present

# === Source build path (existing behavior) ===
- name: Build and deploy Phoebus from source
  when: not (epics_services_use_rpms | bool)
  block:
    - name: Install Maven dependency
      ansible.builtin.include_role:
        name: nsls2.epics_services.maven_dep
      when: cs_studio_phoebus_install_deps | bool

    - name: Ensure correct ownership and permissions for directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: "{{ cs_studio_phoebus_owner }}"
        group: "{{ cs_studio_phoebus_owner }}"
        mode: "u=rwX,g=rX,o=rX"
        state: directory
        recurse: "{{ item.recurse | default(false) }}"
      loop:
        - { path: "{{ cs_studio_phoebus_base_dir }}", recurse: false }
        - { path: "{{ cs_studio_phoebus_products_dest }}", recurse: true }

    - name: Clone and/or update the phoebus repo
      ansible.builtin.git:
        repo: 'https://github.com/ControlSystemStudio/phoebus.git'
        dest: "{{ cs_studio_phoebus_src_dest }}"
        version: "{{ cs_studio_phoebus_version }}"
        update: true
      register: _phoebus_repo

    - name: Clone and/or update the site-specific products repo
      become: true
      become_user: "{{ cs_studio_phoebus_owner }}"
      ansible.builtin.git:
        repo: "{{ cs_studio_phoebus_products_repo }}"
        dest: "{{ cs_studio_phoebus_products_dest }}"
        version: "{{ cs_studio_phoebus_products_version }}"
        update: true
      register: _products_repo
      when: cs_studio_phoebus_products_repo | length > 0

    # Override the default settings.xml maven file if `cs_studio_phoebus_override_mvn_settings` is set.
    - name: Override the default maven settings.xml
      ansible.builtin.template:
        src: settings.xml.j2
        dest: "{{ cs_studio_phoebus_products_dest }}/settings.xml"
        owner: "{{ cs_studio_phoebus_owner }}"
        group: "{{ cs_studio_phoebus_owner }}"
        mode: "u=rw,g=r,o=r"
      when: cs_studio_phoebus_override_mvn_settings

    - name: Check whether the documentation was built for this checkout
      ansible.builtin.stat:
        path: "{{ cs_studio_phoebus_base_dir }}/.phoebus-docs-built"
      register: _phoebus_docs_marker
      when: cs_studio_phoebus_build_docs | bool

    - name: Build the documentation and help  # noqa: no-changed-when no-handler
      ansible.builtin.shell: >-
        JAVA_HOME="{{ cs_studio_phoebus_java_home }}"
        MVN_HOME="{{ cs_studio_phoebus_mvn_home }}"
        PATH="{{ cs_studio_phoebus_java_home }}/bin:{{ cs_studio_phoebus_mvn_home }}/bin:$PATH"
        mvn clean verify --settings={{ cs_studio_phoebus_products_dest }}/settings.xml -P sphinx -N
      args:
        chdir: "{{ cs_studio_phoebus_src_dest }}/"
      when: >-
        (cs_studio_phoebus_build_docs | bool) and
        (_phoebus_repo.changed or not _phoebus_docs_marker.stat.exists)

    # Lets turning build_docs on later trigger a build without a new checkout.
    - name: Record the checkout the documentation was built from
      ansible.builtin.copy:
        content: "{{ _phoebus_repo.after }}\n"
        dest: "{{ cs_studio_phoebus_base_dir }}/.phoebus-docs-built"
        owner: "{{ cs_studio_phoebus_owner }}"
        group: "{{ cs_studio_phoebus_owner }}"
        mode: "u=rw,g=r,o=r"
      when: cs_studio_phoebus_build_docs | bool

    - name: Build the common phoebus binaries
      ansible.builtin.shell: >-
        JAVA_HOME="{{ cs_studio_phoebus_java_home }}"
        MVN_HOME="{{ cs_studio_phoebus_mvn_home }}"
        PATH="{{ cs_studio_phoebus_java_home }}/bin:{{ cs_studio_phoebus_mvn_home }}/bin:$PATH"
        mvn clean install --settings={{ cs_studio_phoebus_products_dest }}/settings.xml -DskipTests=true -Dmaven.javadoc.skip=true
      args:
        chdir: "{{ cs_studio_phoebus_src_dest }}/"
      when: _phoebus_repo.changed or (_products_repo.changed | default(false))
      changed_when: true

    - name: Build site-specific Phoebus products
      ansible.builtin.shell: >-
        JAVA_HOME="{{ cs_studio_phoebus_java_home }}"
        MVN_HOME="{{ cs_studio_phoebus_mvn_home }}"
        PATH="{{ cs_studio_phoebus_java_home }}/bin:{{ cs_studio_phoebus_mvn_home }}/bin:$PATH"
        mvn clean install --settings={{ cs_studio_phoebus_products_dest }}/settings.xml -DskipTests=true -Ddocs={{ cs_studio_phoebus_src_dest }}/docs
      args:
        chdir: "{{ cs_studio_phoebus_products_dest }}/products"
      when: >-
        (cs_studio_phoebus_products_repo | length > 0 or cs_studio_phoebus_build_products) and
        (_phoebus_repo.changed or (_products_repo.changed | default(false)) or
         (cs_studio_phoebus_products_changed | default(false)))
      changed_when: true

# === Configuration (runs regardless of install method) ===
- name: Create run-phoebus
  ansible.builtin.template:
    src: run-phoebus.sh.j2
    dest: "{{ cs_studio_phoebus_launcher }}"
    owner: "{{ cs_studio_phoebus_owner }}"
    group: "{{ cs_studio_phoebus_owner }}"
    mode: "u=rwx,g=rx,o=rx"
  when: cs_studio_phoebus_jar | length > 0
